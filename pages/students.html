<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Students | Britech College Library</title>

    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/students.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>

  <body>
    <div class="app-shell">
      <!-- SIDEBAR -->
      <aside class="sidebar">
        <div class="sidebar-brand">
          <img src="../assets/images/logo/britech-logo (1).png" alt="Britech College Logo" />

          <div>
            <h2>BRITECH LIBRARY</h2>
            <p>MANAGEMENT SYSTEM</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="sidebar-link">
            <i class="fa-solid fa-gauge"></i>
            Dashboard
          </a>

          <a href="books.html" class="sidebar-link">
            <i class="fa-solid fa-book"></i>
            Books
          </a>

          <a href="borrow-return.html" class="sidebar-link">
            <i class="fa-solid fa-right-left"></i>
            Borrow / Return
          </a>

          <a href="students.html" class="sidebar-link active">
            <i class="fa-solid fa-user-graduate"></i>
            Students
          </a>

          <a href="reports.html" class="sidebar-link">
            <i class="fa-solid fa-chart-column"></i>
            Reports
          </a>

          <a href="settings.html" class="sidebar-link">
            <i class="fa-solid fa-gear"></i>
            Settings
          </a>
        </nav>

        <div class="sidebar-logout">
          <a href="../auth/sign-in.html" class="sidebar-link" style="padding-left: 0">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
          </a>
        </div>
      </aside>

      <!-- MAIN AREA -->
      <div class="main-area">
        <!-- TOPBAR -->
        <header class="topbar px-8 py-4">
          <div class="d-flex items-center justify-between gap-6">
            <div style="max-width: 420px; width: 100%">
              <div class="d-flex items-center gap-3 bg-white border border-light-gray radius-full px-5 py-3">
                <i class="fa-solid fa-magnifying-glass text-gray"></i>

                <input type="text" placeholder="Search students..." class="search-input text-14" />
              </div>
            </div>

            <div class="d-flex items-center gap-6">
              <div style="position: relative">
                <i class="fa-regular fa-bell text-gray text-xl"></i>
                <span class="notif-dot"></span>
              </div>

              <div class="d-flex items-center gap-3">
                <div class="avatar-circle">AL</div>

                <div>
                  <p class="text-secondary text-14 font-semibold">Admin Librarian</p>

                  <p class="text-gray text-12">Librarian</p>
                </div>
              </div>
            </div>
          </div>
        </header>

        <!-- PAGE CONTENT -->
        <main class="px-8 py-8">
          <div class="d-flex items-center justify-between mb-8 flex-wrap gap-4">
            <h1 class="text-secondary text-3xl font-bold">Students</h1>

            <a href="#" class="bg-primary text-white px-6 py-3 radius-md text-14 font-semibold">
              <i class="fa-solid fa-plus"></i>
              Add Student
            </a>
          </div>

          <div class="bg-white radius-lg shadow-sm p-6">
            <div style="overflow-x: auto">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Grade Section ID</th>
                    <th>Account ID</th>
                    <th>Last Name</th>
                    <th>First Name</th>
                    <th>Middle Name</th>
                    <th>Contact No.</th>
                    <th>Created At</th>
                    <th>Updated At</th>
                    <th>Action</th>
                  </tr>
                </thead>

                <tbody>
                  <!-- main.js will populate this -->
                </tbody>
              </table>
            </div>

            <div class="pagination mt-6">
              <button class="page-btn">
                <i class="fa-solid fa-chevron-left"></i>
              </button>

              <button class="page-btn active">1</button>

              <button class="page-btn">2</button>

              <button class="page-btn">3</button>

              <button class="page-btn">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../assets/js/main.js"></script>
  </body>
</html>
